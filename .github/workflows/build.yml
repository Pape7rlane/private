name: build

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Make signing key
        run: >
          keytool -genkeypair -v -keystore app/ci.jks -alias ci
          -keyalg RSA -keysize 2048 -validity 10000
          -storepass android -keypass android
          -dname "CN=ci,OU=ci,O=ci,L=ci,ST=ci,C=CN"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace
        env:
          KS_PATH: ci.jks
          KS_PASS: android
          KS_ALIAS: ci

      - uses: actions/upload-artifact@v4
        with:
          name: HSRModProbe-apk
          path: app/build/outputs/apk/release/*.apk
