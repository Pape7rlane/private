name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache NDK and CMake
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/26.1.10909125
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-ndk-26.1.10909125-cmake-3.22.1

      - name: Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$(ls -d "$SDK"/cmdline-tools/*/bin | tail -1)/sdkmanager"
          if [ -d "$SDK/ndk/26.1.10909125" ]; then
            echo "NDK already present, skipping download"
            exit 0
          fi
          timeout 120 bash -c "yes | '$SM' --licenses" > /dev/null 2>&1 || true
          "$SM" --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: native

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 用仓库里固定的 ci.jks, 保证每次构建签名一致, 可以直接覆盖安装
      - name: Keystore
        run: |
          if [ ! -f app/ci.jks ]; then
            keytool -genkeypair -v -keystore app/ci.jks -alias ci \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=ci,OU=ci,O=ci,L=ci,ST=ci,C=CN"
          fi

      - name: Build
        run: gradle assembleRelease --no-daemon -PbuildNo=${{ github.run_number }}
        env:
          KS_PATH: ci.jks
          KS_PASS: android
          KS_ALIAS: ci

      # GitHub 的 artifact 一定会被自动打成 zip, 所以改成把 .apk 直接推到 dist 分支,
      # 产物就是一个裸 APK 文件, 不再是压缩包。
      - name: Publish APK to dist branch
        run: |
          APK="HSRModProbe-probe${GITHUB_RUN_NUMBER}.apk"
          WORK="$(mktemp -d)"
          git config --global user.name  "ci"
          git config --global user.email "ci@users.noreply.github.com"
          git -C "$WORK" init -q
          git -C "$WORK" checkout -q -b dist
          cp app/build/outputs/apk/release/app-release.apk "$WORK/$APK"
          git -C "$WORK" add "$APK"
          git -C "$WORK" commit -qm "probe ${GITHUB_RUN_NUMBER}"
          git -C "$WORK" push -q -f \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dist
          URL="https://github.com/${{ github.repository }}/raw/dist/$APK"
          echo "### APK (裸文件, 直接下载)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "本地拉取: \`gh api repos/${{ github.repository }}/contents/$APK?ref=dist -H 'Accept: application/vnd.github.raw' > $APK\`" >> "$GITHUB_STEP_SUMMARY"
