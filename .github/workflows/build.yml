name: build

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$(ls -d "$SDK"/cmdline-tools/*/bin | tail -1)/sdkmanager"
          echo "sdkmanager: $SM"
          timeout 120 bash -c "yes | '$SM' --licenses" > /dev/null 2>&1 || true
          "$SM" --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Keystore
        run: >
          keytool -genkeypair -v -keystore app/ci.jks -alias ci
          -keyalg RSA -keysize 2048 -validity 10000
          -storepass android -keypass android
          -dname "CN=ci,OU=ci,O=ci,L=ci,ST=ci,C=CN"

      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace
        env:
          KS_PATH: ci.jks
          KS_PASS: android
          KS_ALIAS: ci

      - uses: actions/upload-artifact@v4
        with:
          name: probe-apk
          path: app/build/outputs/apk/release/*.apk
